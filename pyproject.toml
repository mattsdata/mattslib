[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mattslib"
version = "1.1.0"
description = "A small, well-tested library of reusable Python utilities: retries, logging, config, caching, timing and safe file I/O."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mathew Varghese" }]
keywords = ["utilities", "retry", "logging", "config", "cache"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/mattsdata/mattslib"

[tool.hatch.build.targets.wheel]
packages = ["src/mattslib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=mattslib --cov-report=term-missing --cov-fail-under=90"
